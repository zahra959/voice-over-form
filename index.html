



<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Devis Voix-Off</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f7f9fc, #e2eafc);
      padding: 30px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    form {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #444;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus {
      border-color: #007BFF;
      box-shadow: 0 0 5px rgba(0,123,255,0.3);
      outline: none;
    }

    input[readonly] {
      background: #f0f0f0;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #007BFF;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #0056b3;
    }

    /* CAPTCHA */
    #captchaLabel {
      font-weight: 600;
      color: #555;
    }
  </style>
</head>
<body>

  <h2>Formulaire Devis Voix-Off</h2>

  <form id="voiceForm" method="POST" action="https://script.google.com/macros/s/AKfycbykQHChUH_RIHyDHhZVSpv9cj7ABZY8mulWtsCdaxmwGhPUDHcjKKE1sj7Wm2nx0MkX/exec">
    
    <label>Durée du script (en secondes) :</label>
    <input type="number" name="duree" id="duree" oninput="calculPrix()" required>

    <label>Prix :</label>
    <input type="text" name="prix" id="prix" readonly>

    <label>Votre question :</label>
    <textarea name="question" id="question" placeholder="Écrivez votre question ici" required></textarea>

    <label>Votre numéro de téléphone :</label>
    <input type="tel" name="tel" id="tel" placeholder="Ex: 55 555 555" required>

    <label id="captchaLabel"></label>
    <input type="number" id="captcha" placeholder="Réponse" required>

    <button type="submit">Envoyer</button>
  </form>

  <script>
    function calculPrix() {
      var duree = parseInt(document.getElementById("duree").value);
      var prix = "";

      if (!isNaN(duree)) {
        if (duree >= 15 && duree <= 35) {
          prix = "50 DT";
        } else if (duree >= 36) {
          prix = "90 DT";
        } else {
          prix = "Contactez-nous";
        }
      }

      document.getElementById("prix").value = prix;
    }

    // CAPTCHA simple
    var a = Math.floor(Math.random() * 10) + 1;
    var b = Math.floor(Math.random() * 10) + 1;
    document.getElementById("captchaLabel").innerText = `Captcha: ${a} + ${b} = ?`;

    document.getElementById("voiceForm").addEventListener("submit", function(e){
      e.preventDefault();
      var question = document.getElementById("question").value.trim();
      var tel = document.getElementById("tel").value.trim();
      var captchaRep = parseInt(document.getElementById("captcha").value);

      if (!question || !tel) {
        alert("Veuillez remplir votre question et votre numéro de téléphone.");
        return;
      }

      if (captchaRep !== (a + b)) {
        alert("Captcha incorrect. Veuillez réessayer.");
        return;
      }

      alert("Merci ! On va vous contacter très bientôt.");
      e.target.submit();
    });
  </script>

</body>
</html>
